<title>Kelowna Flower Gardens</title>

<style>
:root{
  --pink:#F68686;
  --light:#FDD7D7;
  --muted:#666;
  --max:1100px;
  --radius:14px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:linear-gradient(180deg,var(--pink),#fff);
  color:#333;
}

.wrap{
  max-width:var(--max);
  margin:auto;
  padding:1rem;
}

/* ---------- HEADER ---------- */
header{
  text-align:center;
}

header img{
  width:100%;
  max-height:380px;
  object-fit:cover;
  border-radius:var(--radius);
}

.header-text h1{
  margin:1rem 0 0;
  color:var(--white);
}

.header-text p{
  margin:.5rem 0;
  color:var(--muted);
}

/* ---------- NAV ---------- */
nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:.5rem;
  margin:1rem 0;
}

nav a{
  text-decoration:none;
  padding:.5rem .9rem;
  border-radius:20px;
  background:#fff;
  color:var(--pink);
  font-weight:600;
  font-size:.95rem;
}

nav a:hover{
  background:var(--pink);
  color:#fff;
}

/* ---------- MAIN ---------- */
main img{
  max-width:100%;
  height:auto;
  display:block;
  margin:auto;
}

.centered{text-align:center}

.member-button{
  display:inline-block;
  margin:1.5rem 0;
  padding:14px 26px;
  background:var(--pink);
  color:#fff;
  text-decoration:none;
  border-radius:30px;
  font-weight:600;
}

.member-button:hover{
  background:#f46d6d;
}

/* ---------- SCROLL GALLERY ---------- */
.scroll-container{
  background:var(--light);
  overflow-x:auto;
  white-space:nowrap;
  padding:1rem;
}

.scroll-container img{
  max-width:90%;
  margin:.5rem;
  border-radius:12px;
}

/* ---------- FOOTER ---------- */
footer{
  margin-top:3rem;
  text-align:center;
  padding:1rem 0;
  color:var(--muted);
}


    /* ---------- SIDEBAR ---------- */
.sidebar{
  width:260px;
  background:#fff;
  border-radius:var(--radius);
  padding:1rem;
}

.sidebar h5{
  margin:.75rem 0;
  color:var(--pink);
}

.sidebar a,
.dropdown-btn{
  display:block;
  width:100%;
  padding:.6rem;
  margin:.2rem 0;
  background:#fff;
  color:var(--pink);
  border:none;
  text-align:left;
  font-size:.95rem;
  cursor:pointer;
}

.sidebar a:hover,
.dropdown-btn:hover{
  background:var(--pink);
  color:#fff;
}

.dropdown-container{
  display:none;
  padding-left:1rem;
}

/* ---------- MOBILE MENU ---------- */
.menu-btn{
  display:none;
  position:fixed;
  top:10px;
  right:10px;
  z-index:2000;
  font-size:24px;
  padding:.4rem .7rem;
  border:none;
  background:var(--pink);
  color:#fff;
  border-radius:6px;
}
    /* ---------- MOBILE ---------- */
@media(max-width:900px){
  .wrapper{
    flex-direction:column;
  }

  .sidebar{
    position:fixed;
    top:0;
    right:-280px;
    height:100vh;
    z-index:1500;
    transition:.3s;
  }

  .sidebar.active{
    right:0;
  }

  .menu-btn{
    display:block;
  }
}
 

    /* ---------- AVATAR LOGIN ---------- */
.avatar-wrap{
  position:relative;
  margin-left:auto;
}

.avatar-btn{
  border:none;
  background:none;
  cursor:pointer;
  padding:0;
}

.avatar-btn img{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #F68686;
}

/* Dropdown */
.avatar-menu{
  display:none;
  position:absolute;
  right:0;
  top:120%;
  background:white;
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  overflow:hidden;
  min-width:180px;
  z-index:999;
}

.avatar-menu a{
  display:block;
  padding:.75rem 1rem;
  text-decoration:none;
  color:#F68686;
  font-weight:500;
}

.avatar-menu a:hover{
  background:#FDD7D7;
}

/* Show on hover (desktop) */
.avatar-wrap:hover .avatar-menu{
  display:block;
}

/* Mobile-safe */
@media (max-width:768px){
  .avatar-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:.5rem;
  }
}


</style>
</head>
