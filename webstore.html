<script>
let cart = [];
const TAX_RATE = 0.12;
const SHIPPING = 16.00;

function addToCart(name, price){
  const item = cart.find(i => i.name === name);
  if(item){
    item.qty++;
  }else{
    cart.push({name, price, qty:1});
  }
  renderCart();
}

function removeItem(index){
  cart.splice(index,1);
  renderCart();
}

function renderCart(){
  const cartItems = document.getElementById("cartItems");
  cartItems.innerHTML = "";
  let subtotal = 0;

  cart.forEach((item,i)=>{
    subtotal += item.price * item.qty;
    cartItems.innerHTML += `
      <div class="cart-item">
        ${item.name} × ${item.qty}
        <button onclick="removeItem(${i})">✕</button>
      </div>`;
  });

  const tax = subtotal * TAX_RATE;
  const total = subtotal + tax + SHIPPING;

  document.getElementById("subtotal").textContent = subtotal.toFixed(2);
  document.getElementById("tax").textContent = tax.toFixed(2);
  document.getElementById("total").textContent = total.toFixed(2);
}

/* PAYPAL BUTTON */
paypal.Buttons({
  createOrder:(data,actions)=>{
    if(cart.length === 0){
      alert("Your cart is empty");
      return;
    }

    const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
    const tax = subtotal * TAX_RATE;
    const total = subtotal + tax + SHIPPING;

    return actions.order.create({
      purchase_units:[{
        amount:{
          currency_code:"CAD",
          value:total.toFixed(2),
          breakdown:{
            item_total:{value:subtotal.toFixed(2),currency_code:"CAD"},
            tax_total:{value:tax.toFixed(2),currency_code:"CAD"},
            shipping:{value:SHIPPING.toFixed(2),currency_code:"CAD"}
          }
        },
        items:cart.map(i=>({
          name:i.name,
          unit_amount:{value:i.price.toFixed(2),currency_code:"CAD"},
          quantity:i.qty
        }))
      }]
    });
  },

  onApprove:(data,actions)=>{
    return actions.order.capture().then(details=>{
      alert("Payment completed by " + details.payer.name.given_name);
      cart=[];
      renderCart();
    });
  },

  onError:(err)=>{
    console.error(err);
    alert("Payment failed");
  }
}).render("#paypal-button-container");
</script>
